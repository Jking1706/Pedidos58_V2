<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Acceso de empleados · Sabor +58</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px; background: #f0ece4; color: #191919; font-family: system-ui, sans-serif; }
    main { width: min(100%, 420px); padding: 32px; background: white; border-top: 5px solid #f5c518; border-radius: 12px; }
    .brand { margin: 0 0 28px; font-weight: 900; letter-spacing: 2px; }
    .brand span { color: #b81720; }
    h1 { font-size: 1.65rem; margin-bottom: 8px; }
    p { line-height: 1.5; }
    label { display: block; margin: 20px 0 6px; font-weight: 650; }
    input, button, .link { width: 100%; min-height: 46px; border-radius: 6px; font: inherit; }
    input { padding: 10px; border: 1px solid #777; }
    button, .link { display: block; text-align: center; padding: 12px; margin-top: 20px; background: #003087; color: white; border: 0; cursor: pointer; }
    .link { background: #eee; color: #003087; }
    :focus-visible { outline: 3px solid #003087; outline-offset: 3px; }
    button:disabled { opacity: .6; cursor: wait; }
    #status { min-height: 24px; color: #a0161d; overflow-wrap: anywhere; }
    [hidden] { display: none !important; }
  </style>
</head>
<body>
  <main>
    <p class="brand">SABOR <span>+58</span></p>
    <h1 id="title">Acceso de empleados</h1>
    <p id="intro">Inicia sesión para acceder al punto de venta y los paneles.</p>
    <form id="login-form">
      <label for="username">Usuario</label>
      <input id="username" name="username" autocomplete="username" required minlength="3" maxlength="64" autocapitalize="none" spellcheck="false">
      <label for="password">Contraseña</label>
      <input id="password" name="password" type="password" autocomplete="current-password" required maxlength="128" aria-describedby="status">
      <button id="login-button" type="submit">Iniciar sesión</button>
    </form>
    <section id="session" hidden aria-label="Sesión actual">
      <p id="identity"></p>
      <a class="link" href="/">Ir al punto de venta</a>
      <a class="link" href="/admin-dashboard">Ir al dashboard</a>
      <button id="logout" type="button">Cerrar sesión</button>
    </section>
    <p id="status" role="status" aria-live="polite"></p>
  </main>
  <script>
    const form = document.getElementById('login-form');
    const status = document.getElementById('status');
    const loginButton = document.getElementById('login-button');
    async function request(url, data) {
      const response = await fetch(url, data ? { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(data) } : {});
      const payload = await response.json();
      if (!response.ok) throw new Error(payload.error || 'No se pudo completar la solicitud');
      return payload;
    }
    form.addEventListener('submit', async (event) => {
      event.preventDefault();
      loginButton.disabled = true;
      status.textContent = 'Verificando acceso…';
      try {
        const user = await request('/api/auth/login', { username: form.username.value, password: form.password.value });
        form.password.value = '';
        location.replace(user.role === 'consulta' ? '/admin-dashboard' : '/');
      } catch (error) { status.textContent = error.message; }
      finally { loginButton.disabled = false; }
    });
    document.getElementById('logout').addEventListener('click', async (event) => {
      event.target.disabled = true;
      try { await request('/api/auth/logout', {}); location.replace('/login'); }
      catch (error) { status.textContent = error.message; event.target.disabled = false; }
    });
    if (location.pathname === '/mi-sesion') {
      form.hidden = true;
      request('/api/auth/me').then((user) => {
        document.getElementById('title').textContent = 'Mi sesión';
        document.getElementById('intro').textContent = 'Cierra la sesión al terminar tu turno en un equipo compartido.';
        document.getElementById('identity').textContent = `${user.username} · ${user.role}`;
        if (user.role === 'consulta') document.querySelector('a[href="/"]').hidden = true;
        document.getElementById('session').hidden = false;
      }).catch(() => location.replace('/login'));
    }
  </script>
</body>
</html>
